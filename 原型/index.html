<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法律论证标注系统 · 原型</title>
<script>
window.addEventListener("error", function (e) {
  var box = document.getElementById("js-errors");
  function append() {
    if (!box) { box = document.createElement("div"); box.id = "js-errors"; box.style.display = "none"; document.body.appendChild(box); }
    box.textContent += "[JS ERROR] " + (e.message || "unknown") + " @" + (e.filename || "") + ":" + (e.lineno || 0) + " ;; ";
  }
  if (document.body) append(); else document.addEventListener("DOMContentLoaded", append);
});
</script>
<link rel="stylesheet" href="src/style.css">
</head>

<main id="view-root"></main>
