<title>法律论证标注系统 · 原型</title>

<style>
:root{
  --bg:#f4f6f8;--panel:#fff;--ink:#1f2430;--muted:#667085;--line:#e4e7ec;
  --primary:#2f5fd0;--primary-weak:#eef3fd;
  --green:#157a4d;--green-weak:#e9f6ef;
  --amber:#9a6b00;--amber-weak:#fbf3df;
  --red:#b42318;--red-weak:#fdecea;
  --violet:#5b3ea8;--violet-weak:#f0ecfa;
  --radius:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.65 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,h4{margin:0 0 8px}
h2{font-size:20px}h3{font-size:15px}h4{font-size:14px}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:Consolas,"Courier New",monospace}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.hidden{display:none!important}

.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 20px;background:#101828;color:#fff;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand small{opacity:.65;font-weight:400;margin-left:6px;font-size:12px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:transparent;border:0;color:#cbd2dc;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}
.nav button:hover{background:rgba(255,255,255,.10);color:#fff}
.nav button.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.role-select{display:flex;align-items:center;gap:6px;font-size:12px;color:#cbd2dc}
.role-select select{background:#1d2939;color:#fff;border:1px solid #344054;border-radius:8px;padding:5px 8px;font-family:inherit}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:#e4e7ec;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#32d583}

.page{max-width:1360px;margin:0 auto;padding:20px}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:20px;margin-bottom:2px}
.page-head .sub{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.grid.cols-3,.grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card.pad-sm{padding:12px}
.card-hover:hover{border-color:#c9d4e8;box-shadow:0 2px 6px rgba(16,24,40,.10)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:#c4cddd;background:#f9fafb}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#284fae}
.btn.ghost{background:transparent;border-color:transparent;color:var(--primary)}
.btn.ghost:hover{background:var(--primary-weak)}
.btn.danger{color:var(--red);border-color:#f0c6c2;background:#fff}
.btn.danger:hover{background:var(--red-weak)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.small{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-link{background:none;border:0;color:var(--primary);cursor:pointer;font:inherit;font-size:12px;padding:2px 4px;border-radius:6px}
.btn-link:hover{background:var(--primary-weak)}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.tag.gray{background:#f2f4f7;color:#475467;border-color:#e4e7ec}
.tag.blue{background:var(--primary-weak);color:var(--primary);border-color:#cdddfb}
.tag.green{background:var(--green-weak);color:var(--green);border-color:#bfe3d0}
.tag.amber{background:var(--amber-weak);color:var(--amber);border-color:#edd9a3}
.tag.red{background:var(--red-weak);color:var(--red);border-color:#f0c6c2}
.tag.violet{background:var(--violet-weak);color:var(--violet);border-color:#d8cdf3}

.progress{height:8px;background:#eef0f3;border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
.progress.green>i{background:var(--green)}

.table{width:100%;border-collapse:collapse}
.table th,.table td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;font-size:13px;vertical-align:top}
.table th{color:var(--muted);font-weight:600;background:#fafbfc;white-space:nowrap}
.table tr:last-child td{border-bottom:0}

.kv{display:grid;grid-template-columns:112px 1fr;gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

.panel{background:#fbfcfd;border:1px solid var(--line);border-radius:8px;padding:12px}
.panel h4{color:var(--muted);font-size:12px;text-transform:none;letter-spacing:.02em;margin-bottom:8px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font:inherit;font-size:13px}
.tabs button:hover{color:var(--ink)}
.tabs button.active{color:var(--primary);border-color:var(--primary);font-weight:600}

.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.step{display:flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:13px}
.step .num{width:20px;height:20px;border-radius:50%;background:#eef0f3;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.step.done{color:var(--green);border-color:#bfe3d0;background:var(--green-weak)}
.step.done .num{background:#cde9da;color:var(--green)}
.step.active{color:var(--primary);border-color:#bcd0f5;background:var(--primary-weak);font-weight:600}
.step.active .num{background:#c9daf8;color:var(--primary)}

.workbench{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1.35fr);gap:12px;align-items:start}
@media (max-width:1100px){.workbench{grid-template-columns:1fr}}
.workbench.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}

.paper{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;font-size:14px;line-height:2;max-height:560px;overflow:auto}
.paper .seg{padding:1px 2px;border-radius:4px;cursor:pointer;border:1.5px solid transparent}
.paper .seg:hover{background:#f2f5fb}
.paper .seg.boxed{border-color:var(--primary);background:var(--primary-weak)}
.paper .seg.boxed.alt{border-color:var(--violet);background:var(--violet-weak)}
.paper .seg.picked{background:#ffe9b8;border-color:#e7c766}
.paper .seg .no{font-size:10px;color:var(--primary);vertical-align:super;font-weight:700;margin-right:1px}

.list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.list-item:hover{border-color:#c9d4e8}
.list-item.active{border-color:var(--primary);background:var(--primary-weak)}
.list-item .idx{font-weight:700;color:var(--primary);min-width:28px}
.list-item .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .txt.wrap{white-space:normal}

.empty{color:var(--muted);text-align:center;padding:28px;border:1px dashed var(--line);border-radius:var(--radius);background:#fbfcfd}

.modal-mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:18px;box-shadow:0 12px 32px rgba(16,24,40,.24)}
.modal.wide{max-width:900px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.modal-head h3{margin:0}
.modal-close{border:0;background:none;font-size:18px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px}
.modal-close:hover{background:#f2f4f7}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}

.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:120}
.toast{background:#101828;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:360px}
.toast.ok{background:#0f6b45}
.toast.warn{background:#8a5a00}
.toast.err{background:#9b2c23}

.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.form-row>label{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:760px){.form-grid{grid-template-columns:1fr}}
input[type=text],input[type=file],select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;color:inherit;background:#fff;width:100%}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{outline:2px solid #cdddfb;border-color:var(--primary)}
.upload{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--muted);background:#fbfcfd;cursor:pointer}
.upload:hover{border-color:#b9c8e4;background:#f7faff}
.checkbox{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.checkbox input{width:auto}

.diff-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.diff-card .diff-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.diff-a{background:var(--red-weak);border:1px solid #f0c6c2;border-radius:6px;padding:4px 8px;font-size:13px}
.diff-b{background:var(--green-weak);border:1px solid #bfe3d0;border-radius:6px;padding:4px 8px;font-size:13px}

.diagram{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.diagram svg{display:block;width:100%;height:auto;background:
  linear-gradient(#f0f2f5 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,#f0f2f5 1px,transparent 1px) 0 0/24px 24px}
.diagram .node{cursor:grab}
.diagram .node text{font-size:12px;font-family:"Segoe UI","Microsoft YaHei",sans-serif;user-select:none}
.rel-node text{font-size:12px;font-weight:700}

.notice{border-left:4px solid var(--amber);background:var(--amber-weak);padding:10px 12px;border-radius:6px;font-size:13px}
.notice.info{border-color:var(--primary);background:var(--primary-weak)}
.notice.ok{border-color:var(--green);background:var(--green-weak)}

.tag-panel{display:flex;flex-direction:column;gap:10px}
.tag-group h4{margin:0 0 6px;color:var(--muted);font-size:12px}
.tag-options{display:flex;flex-wrap:wrap;gap:6px}
.tag-options button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}
.tag-options button:hover{border-color:#c4cddd;background:#f9fafb}
.tag-options button.active{border-color:var(--primary);background:var(--primary-weak);color:var(--primary);font-weight:600}
.tag-options button .code{font-weight:700;margin-right:4px}

.marked{outline:2px solid var(--primary);outline-offset:1px;border-radius:4px}
.warn-text{color:var(--amber);font-size:12px}
.err-text{color:var(--red);font-size:12px}
.ok-text{color:var(--green);font-size:12px}
.code-chip{font-family:Consolas,monospace;background:#f2f4f7;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px}
.score{font-weight:700;font-size:22px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1.5px solid var(--ink)}
.legend i.fill{background:var(--ink)}
.legend i.plus{background:#fff}

</style>
</head>

/* ===== core.js ===== */
window.APP = (function () {
  var state = {
    role: "admin",
    view: "tasks",
    params: {},
    currentTaskId: "T1",
    currentDocId: "D1",
    practice: false,
    annotateMode: "cut"
  };
  var views = {};
  var ROLE_NAMES = {
    admin: "管理员",
    teacher: "教师",
    annotator: "标注员",
    student: "学生",
    adjudicator: "仲裁员",
    expert: "领域专家"
  };
  var NAV = [
    { id: "tasks", label: "任务列表", roles: ["admin", "teacher", "annotator", "student", "adjudicator", "expert"] },
    { id: "people", label: "人员管理", roles: ["admin"] },
    { id: "create", label: "任务创建", roles: ["admin", "teacher"] },
    { id: "annotate", label: "标注工作台", roles: ["admin", "annotator", "student"] },
    { id: "adjudicate", label: "裁定", roles: ["admin", "adjudicator", "expert"] },
    { id: "export", label: "导出", roles: ["admin", "adjudicator"] },
    { id: "teaching", label: "教学展示", roles: ["admin", "teacher", "student"] }
  ];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function registerView(id, def) {
    views[id] = def;
  }

  function currentView() {
    return views[state.view];
  }

  function goto(id, params, skipHistory) {
    var prev = currentView();
    if (prev && prev.leave) prev.leave();
    state.view = id;
    state.params = params || {};
    if (id !== "annotate" && id !== "teaching") state.practice = false;
    var host = document.getElementById("view-root");
    host.innerHTML = "";
    var root = document.createElement("div");
    host.appendChild(root);
    var view = views[id];
    if (!view) {
      root.innerHTML = '<div class="page"><div class="empty">该页面尚未实现</div></div>';
    } else {
      view.render(root, state.params);
    }
    updateNav();
    if (!skipHistory) {
      try { history.pushState(null, "", "#" + id); } catch (e) {}
    }
    window.scrollTo(0, 0);
  }

  function updateNav() {
    var nav = document.getElementById("topnav");
    if (!nav) return;
    Array.prototype.forEach.call(nav.querySelectorAll("button"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-view") === state.view);
    });
  }

  function canView(id) {
    var item = NAV.filter(function (n) { return n.id === id; })[0];
    if (!item || !item.roles) return true;
    return item.roles.indexOf(state.role) !== -1;
  }

  function renderTopbar() {
    var topbar = document.getElementById("topbar");
    var roleOptions = Object.keys(ROLE_NAMES).map(function (k) {
      return '<option value="' + k + '"' + (k === state.role ? " selected" : "") + ">" + ROLE_NAMES[k] + "</option>";
    }).join("");
    topbar.innerHTML =
      '<div class="brand">法律论证标注系统<small>原型 · 裁判文书论证结构标注</small></div>' +
      '<nav class="nav" id="topnav">' +
      NAV.filter(function (n) {
        return !n.roles || n.roles.indexOf(state.role) !== -1;
      }).map(function (n) {
        return '<button type="button" data-view="' + n.id + '">' + n.label + "</button>";
      }).join("") +
      "</nav>" +
      '<div class="spacer"></div>' +
      '<span class="chip"><span class="dot"></span>指南 ' + esc((window.MOCK && window.MOCK.guide.version) || "v1.2") + "</span>" +
      '<div class="role-select">当前角色<select id="role-switch">' + roleOptions + "</select></div>";
    document.getElementById("role-switch").addEventListener("change", function (e) {
      state.role = e.target.value;
      renderTopbar();
      if (canView(state.view)) goto(state.view, state.params);
      else goto("tasks");
    });
    document.getElementById("topnav").addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-view]");
      if (btn) goto(btn.getAttribute("data-view"));
    });
  }

  function statusTag(status) {
    var map = {
      "待标注": "gray", "标注中": "blue", "已提交": "blue", "待裁定": "amber",
      "已裁定": "green", "已完成": "green", "教学练习": "violet", "已提交练习": "violet"
    };
    var cls = map[status] || "gray";
    return '<span class="tag ' + cls + '">' + esc(status) + "</span>";
  }

  function progress(pct, green) {
    return '<div class="progress' + (green ? " green" : "") + '"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></div>';
  }

  function toast(msg, kind) {
    var wrap = document.getElementById("toasts");
    var el = document.createElement("div");
    el.className = "toast " + (kind || "");
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function () { el.remove(); }, 2800);
  }

  function closeModal() {
    document.getElementById("modal-root").innerHTML = "";
  }

  function modal(opts) {
    opts = opts || {};
    var root = document.getElementById("modal-root");
    var actions = (opts.actions || []).map(function (a, i) {
      return '<button type="button" class="btn ' + (a.kind || "") + '" data-idx="' + i + '">' + esc(a.label) + "</button>";
    }).join("");
    root.innerHTML =
      '<div class="modal-mask"><div class="modal' + (opts.wide ? " wide" : "") + '">' +
      '<div class="modal-head"><h3>' + esc(opts.title || "") + '</h3><button type="button" class="modal-close">×</button></div>' +
      '<div class="modal-body">' + (opts.body || "") + "</div>" +
      (actions ? '<div class="modal-actions">' + actions + "</div>" : "") +
      "</div></div>";
    root.querySelector(".modal-close").addEventListener("click", closeModal);
    Array.prototype.forEach.call(root.querySelectorAll(".modal-actions button"), function (b) {
      b.addEventListener("click", function () {
        var a = opts.actions[Number(b.getAttribute("data-idx"))];
        var keep = a.onClick && a.onClick();
        if (keep !== false) closeModal();
      });
    });
  }

  function confirmDialog(msg, onOk) {
    modal({
      title: "确认操作",
      body: "<p>" + esc(msg) + "</p>",
      actions: [
        { label: "取消", kind: "" },
        { label: "确认", kind: "primary", onClick: onOk }
      ]
    });
  }

  function pending(feature) {
    modal({
      title: "细节待确认",
      body: "<p>「" + esc(feature) + "」的实现细节尚未定稿，已记录在《问题.txt》。原型中暂以示意方式呈现。</p>",
      actions: [{ label: "知道了", kind: "primary" }]
    });
  }

  function addStyle(id, css) {
    if (document.getElementById("style-" + id)) return;
    var el = document.createElement("style");
    el.id = "style-" + id;
    el.textContent = css;
    document.head.appendChild(el);
  }

  function role() {
    return state.role;
  }
  function roleName() {
    return ROLE_NAMES[state.role] || state.role;
  }

  function fmtDate(d) {
    var t = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d + " " + p(t.getHours()) + ":" + p(t.getMinutes());
  }

  function syncFromHash() {
    var h = (location.hash || "").replace("#", "");
    if (views.hasOwnProperty(h) && h !== state.view) goto(h, {}, true);
  }

  window.addEventListener("popstate", syncFromHash);
  window.addEventListener("hashchange", syncFromHash);

  function boot() {
    renderTopbar();
    var h = (location.hash || "").replace("#", "");
    goto(views[h] ? h : "tasks", {}, true);
  }

  window.addEventListener("load", boot);

  return {
    state: state,
    views: views,
    registerView: registerView,
    goto: goto,
    esc: esc,
    role: role,
    roleName: roleName,
    fmtDate: fmtDate,
    data: window.MOCK,
    ui: {
      toast: toast,
      modal: modal,
      closeModal: closeModal,
      confirm: confirmDialog,
      pending: pending,
      addStyle: addStyle,
      statusTag: statusTag,
      progress: progress
    }
  };
})();

  function taskActions(task, role) {
    var actions = [];
    if (role === "annotator" && task.status === "标注中") {

      actions.push({ label: "开始裁定", kind: "primary", act: "adjudicate" });
    }
    if (role === "admin" && task.status !== "教学练习") {
      actions.push({ label: "查看标注", act: "annotate" });
    }

      root.addEventListener("click", function (e) {
        var quickBtn = e.target.closest("button[data-quick]");
        if (quickBtn) {
          var q = quickBtn.getAttribute("data-quick");
          if (q === "create") APP.goto("create");
          if (q === "next") { APP.state.currentTaskId = "T1"; APP.goto("annotate", { mode: "cut" }); }
          if (q === "adjudicate") APP.goto("adjudicate");
          if (q === "teaching") APP.goto("teaching");
          return;
        }
        var btn = e.target.closest("button[data-act]");
        if (!btn) return;
        var task = APP.data.tasks.filter(function (t) { return t.id === btn.getAttribute("data-id"); })[0];
        var act = btn.getAttribute("data-act");
        APP.state.currentTaskId = task.id;
        if (act === "annotate") APP.goto("annotate", { mode: task.teaching ? "cut" : "cut", taskId: task.id });
        if (act === "adjudicate") APP.goto("adjudicate");
        if (act === "export") APP.goto("export");
        if (act === "teaching") { APP.state.practice = task.teaching; APP.goto("teaching"); }
        if (act === "detail") detail(task);
      });
    }
  });

(function () {
  var ROLE_TAG = {
    "管理员": "violet",
    "教师": "blue",
    "标注员": "green",
    "学生": "amber"
  };

  function rolesOf(user) {
    if (user.roles && user.roles.length) return user.roles.slice();
    return user.role ? [user.role] : [];
  }

  function privsOf(user) {
    return user.privileges ? user.privileges.slice() : [];
  }

  function roleTagsHtml(roles) {
    if (!roles.length) return '<span class="muted">—</span>';
    return roles.map(function (r) {
      return '<span class="tag ' + (ROLE_TAG[r] || "gray") + '">' + APP.esc(r) + "</span>";
    }).join(" ");
  }

  function privTagsHtml(privs) {
    if (!privs.length) return '<span class="muted">—</span>';
    return privs.map(function (p) {
      return '<span class="tag gray">' + APP.esc(p) + "</span>";
    }).join(" ");
  }

  function checklistHtml(catalog, checked) {
    return catalog.map(function (v) {
      var on = checked.indexOf(v) !== -1;
      return '<label class="checkbox"><input type="checkbox" data-pick value="' + APP.esc(v) + '"' + (on ? " checked" : "") + ">" +
        "<span>" + APP.esc(v) + "</span></label>";
    }).join("");
  }

  function pickedValues() {
    var out = [];
    Array.prototype.forEach.call(document.querySelectorAll("#modal-root [data-pick]:checked"), function (el) {
      out.push(el.value);
    });
    return out;
  }

  function orderRoles(picked, current) {
    var catalog = (APP.data && APP.data.roleCatalog) || [];
    return picked.slice().sort(function (a, b) {
      var ia = current.indexOf(a);
      var ib = current.indexOf(b);
      if (ia === -1) ia = 1000 + catalog.indexOf(a);
      if (ib === -1) ib = 1000 + catalog.indexOf(b);
      return ia - ib;
    });
  }

  function userRowHtml(user, manage) {
    var id = APP.esc(user.id);
    var ops = manage
      ? '<div class="row">' +
        '<button type="button" class="btn small" data-act="roles" data-id="' + id + '">编辑角色</button>' +
        '<button type="button" class="btn small" data-act="privs" data-id="' + id + '">授予特权</button>' +
        '<button type="button" class="btn small danger" data-act="remove" data-id="' + id + '">移除</button>' +
        "</div>"
      : '<span class="muted">—</span>';
    return "<tr>" +
      "<td><strong>" + APP.esc(user.name) + "</strong></td>" +
      "<td>" + roleTagsHtml(rolesOf(user)) + "</td>" +
      "<td>" + privTagsHtml(privsOf(user)) + "</td>" +
      "<td>" + ops + "</td></tr>";
  }

  function tableHtml(users, manage) {
    var rows = users.length
      ? users.map(function (u) { return userRowHtml(u, manage); }).join("")
      : '<tr><td colspan="4" class="muted">暂无用户</td></tr>';
    return '<div class="card">' +
      '<table class="table"><thead><tr><th>姓名</th><th>角色</th><th>特权</th><th>操作</th></tr></thead>' +
      "<tbody>" + rows + "</tbody></table>" +
      "</div>";
  }

  function pageHtml(users, manage) {
    return '<div class="page">' +
      '<div class="page-head"><div><h2>人员管理</h2><div class="sub">维护用户与角色、授予特权（一人可多角色；创建者可赋予他人特权）</div></div>' +
      '<span class="spacer"></span>' +
      (manage ? '<button type="button" class="btn primary" data-act="add">新增用户</button>' : '<span class="tag gray">只读模式</span>') +
      "</div>" +
      tableHtml(users, manage) +
      '<div class="notice ' + (manage ? "info" : "") + ' mt16">' +
      (manage
        ? "一人可拥有多个角色；学生泛化自标注员（练习中复用标注功能）。特权用于授予非管理员上传数据、创建任务等能力（对应用例 A1 维护用户与角色 / A2 授予特权）。"
        : "人员管理仅管理员可操作；当前角色为只读查看。") +
      "</div>" +
      "</div>";
  }

  APP.registerView("people", {
    title: "人员管理",
    render: function (root, params) {
      var users = ((APP.data && APP.data.users) || []).slice();
      var roleCatalog = (APP.data && APP.data.roleCatalog) || [];
      var privCatalog = (APP.data && APP.data.privilegeCatalog) || [];
      var canManage = APP.role() === "admin";

      function writeBack() {
        if (APP.data) APP.data.users = users;
      }

      function paint() {
        root.innerHTML = pageHtml(users, canManage);
      }

      function findUser(id) {
        for (var i = 0; i < users.length; i++) {
          if (users[i].id === id) return i;
        }
        return -1;
      }

      function nextId() {
        var max = 0;
        users.forEach(function (u) {
          var m = /^u(\d+)$/.exec(u.id || "");
          if (m) max = Math.max(max, Number(m[1]));
        });
        return "u" + (max + 1);
      }

      function editRoles(user) {
        var current = rolesOf(user);
        APP.ui.modal({
          title: "编辑角色 · " + user.name,
          body: '<p class="muted small">一人可拥有多个角色；保存后同步角色字段（roles[0]）。</p>' +
            '<div class="form-row"><label>角色（可多选）</label>' + checklistHtml(roleCatalog, current) + "</div>",
          actions: [
            { label: "取消" },
            {
              label: "保存", kind: "primary", onClick: function () {
                var list = orderRoles(pickedValues(), current);
                if (!list.length) {
                  APP.ui.toast("请至少选择一个角色", "warn");
                  return false;
                }
                user.roles = list;
                user.role = list[0];
                writeBack();
                paint();
                APP.ui.toast("已更新角色：" + user.name + "（" + list.join("、") + "）", "ok");
              }
            }
          ]
        });
      }

      function grantPrivs(user) {
        var current = privsOf(user);
        APP.ui.modal({
          title: "授予特权 · " + user.name,
          body: '<p class="muted small">取消勾选即回收对应特权。</p>' +
            '<div class="form-row"><label>特权</label>' + checklistHtml(privCatalog, current) + "</div>",
          actions: [
            { label: "取消" },
            {
              label: "保存", kind: "primary", onClick: function () {
                var list = pickedValues();
                user.privileges = list;
                writeBack();
                paint();
                APP.ui.toast("已更新特权：" + user.name + "（" + (list.join("、") || "无") + "）", "ok");
              }
            }
          ]
        });
      }

      function removeUser(user) {
        APP.ui.confirm("确定移除用户「" + user.name + "」吗？原型演示：仅从人员列表移除。", function () {
          var idx = findUser(user.id);
          if (idx !== -1) users.splice(idx, 1);
          writeBack();
          paint();
          APP.ui.toast("已移除用户：" + user.name, "ok");
        });
      }

      function addUser() {
        APP.ui.modal({
          title: "新增用户",
          body: '<div class="form-row"><label>姓名</label><input type="text" data-name placeholder="请输入姓名"></div>' +
            '<div class="form-row"><label>角色（可多选）</label>' + checklistHtml(roleCatalog, ["标注员"]) + "</div>",
          actions: [
            { label: "取消" },
            {
              label: "确定", kind: "primary", onClick: function () {
                var input = document.querySelector("#modal-root [data-name]");
                var name = input ? input.value.trim() : "";
                if (!name) {
                  APP.ui.toast("请输入姓名", "warn");
                  return false;
                }
                var list = orderRoles(pickedValues(), []);
                if (!list.length) {
                  APP.ui.toast("请至少选择一个角色", "warn");
                  return false;
                }
                users.push({ id: nextId(), name: name, role: list[0], roles: list, privileges: [] });
                writeBack();
                paint();
                APP.ui.toast("已新增用户：" + name + "（" + list.join("、") + "）", "ok");
              }
            }
          ]
        });
      }

      root.addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-act]");
        if (!btn) return;
        if (!canManage) {
          APP.ui.toast("只读模式：人员管理仅管理员可操作", "warn");
          return;
        }
        var act = btn.getAttribute("data-act");
        if (act === "add") {
          addUser();
          return;
        }
        var idx = findUser(btn.getAttribute("data-id"));
        if (idx === -1) return;
        var user = users[idx];
        if (act === "roles") editRoles(user);
        if (act === "privs") grantPrivs(user);
        if (act === "remove") removeUser(user);
      });

      paint();
    }
  });
})();

        return teaching() ? TEACHING_ADJUDICATORS : ADJUDICATORS;
      }

      function defaultAnnotators() {
        return teaching() ? ["张三", ANNOTATORS[1]] : [ANNOTATORS[0], ANNOTATORS[1]];
      }

      function defaultAssign() {
        return { annotators: defaultAnnotators(), adj: teaching() ? TEACHING_ADJUDICATORS[0] : ADJUDICATORS[0] };
      }

      function latestVersion() {
        return history.length ? history[history.length - 1].version : guide.version;
      }

      function activeVersion() {
        return selectedVersion || latestVersion();
      }

      function pageSubtitle() {
        if (role === "teacher") return "教师创建教学练习任务：标注者默认包含学生，仲裁员默认为教师。";
        if (role === "admin") return "管理员创建科研标注任务：每份文书双人独立标注，并指定仲裁员。";
        return "向导共 5 步：上传文书 → 确定标注范围 → 案例信息 → 导入指南 → 分配人员。当前角色：" + APP.roleName();
      }

      root.innerHTML =
        '<div class="page">' +
        '<div class="page-head"><div><h2>任务创建</h2><div class="sub">' + APP.esc(pageSubtitle()) + "</div></div></div>" +
        '<div class="stepbar" data-stepbar></div>' +
        "<div data-step-content></div>" +
        '<div class="create-foot" data-foot></div>' +
        "</div>";

      var barEl = root.querySelector("[data-stepbar]");
      var contentEl = root.querySelector("[data-step-content]");
      var footEl = root.querySelector("[data-foot]");

      function newAssign() {
        return files.map(function () { return defaultAssign(); });
      }

      function render() {
        barEl.innerHTML = stepbarHtml();
        contentEl.innerHTML = contentHtml();
        footEl.innerHTML = footHtml();
      }

      function setStep(n) {
        if (n < 1 || n > STEP_NAMES.length) return;
        step = n;
        render();
      }

      function stepbarHtml() {
        return STEP_NAMES.map(function (name, i) {
          var n = i + 1;
          var cls = n === step ? " active" : (n < step ? " done" : "");
          return '<div class="step' + cls + '"><span class="num">' + (n < step ? "✓" : n) + "</span>" + name + "</div>";
        }).join("");
      }

      function footHtml() {
        var prev = '<button type="button" class="btn" data-nav="prev"' + (step === 1 ? " disabled" : "") + ">上一步</button>";
        var next = step === STEP_NAMES.length
          ? '<button type="button" class="btn primary" data-nav="create">创建任务</button>'
          : '<button type="button" class="btn primary" data-nav="next">下一步</button>';
        return prev +
          '<span class="create-step-hint">第 ' + step + " 步 / 共 " + STEP_NAMES.length + " 步 · " + STEP_NAMES[step - 1] + "</span>" +
          '<span class="spacer"></span>' + next;
      }

      function contentHtml() {
        if (step === 1) return step1Html();
        if (step === 2) return step2Html();
        if (step === 3) return step3Html();
        if (step === 4) return step4Html();
        return step5Html();
      }

      function step1Html() {
        return '<div class="grid cols-2">' +
          '<div class="card">' +
          "<h3>上传文书</h3>" +
          '<div class="form-row" style="max-width:320px"><label>任务类型</label><select data-task-type>' +
          TASK_TYPES.map(function (t) {
            return "<option" + (t === taskType ? " selected" : "") + ">" + t + "</option>";
          }).join("") + "</select></div>" +
          '<p class="muted small">支持 PDF / DOCX / TXT；原始判决书将按《指南》规则自动提取“本院认为”部分。</p>' +
          '<div class="upload create-upload" data-upload><div><strong>点击选择文件</strong></div><div class="small">或将文书拖拽到此区域（原型示意，不读取真实文件）</div></div>' +
          '<div class="row mt12"><button type="button" class="btn" data-batch>批量上传</button><button type="button" class="btn" data-paste>手动录入 / 复制粘贴</button><span class="spacer"></span><span class="small muted">已选 ' + files.length + " 份</span></div>" +
          "</div>" +
          '<div class="card">' + fileTableHtml() + "</div>" +
          "</div>";
      }

      function fileTableHtml() {
        if (!files.length) return "<h3>已选文书</h3><div class=\"empty\">尚未选择文书，请先上传或手动录入</div>";
        var rows = files.map(function (f, i) {
          return "<tr><td><strong>" + APP.esc(f.name) + '</strong><div class="create-doc-title">' + APP.esc(f.title) + "</div></td>" +
            "<td>" + APP.esc(f.type) + "</td>" +
            '<td><button type="button" class="btn-link" data-remove-file="' + i + '">移除</button></td></tr>';
        }).join("");
        return "<h3>已选文书（" + files.length + " 份）</h3>" +
          '<table class="table"><thead><tr><th>文书</th><th>文书类型</th><th>操作</th></tr></thead><tbody>' + rows + "</tbody></table>";
      }

      function step2Html() {
        return '<div class="card">' +
          '<div class="row mb8"><h3 style="margin:0">确定标注范围</h3><span class="spacer"></span><span class="small muted">文书一 · 原始判决书</span></div>' +
          '<div class="notice info">原始判决书范围＝“本院认为”之后、“判决如下”所在句子之前；下列 [ ] 内即系统按《指南》规则提取的待标注范围（示意）。</div>' +
          '<div class="paper mt12">' + rangeHtml(doc.reasonText) + "</div>" +
          '<div class="create-legend"><span><span class="marked">高亮</span>＝关键起止标记</span><span><span class="create-bracket">[ ]</span>＝提取范围</span><span>共 ' + doc.reasonText.length + " 字（示意）</span></div>" +
          '<div class="row mt12"><button type="button" class="btn" data-reextract>重新提取</button><button type="button" class="btn" data-adjust>手动调整范围</button></div>' +
          "</div>";
      }

      function step3Html() {
        var fields = CASE_FIELDS[caseType] || [];
        var values = caseValues[caseType] || {};
        return '<div class="card">' +
          '<div class="row mb12"><h3 style="margin:0">案例信息</h3><span class="spacer"></span><span class="small muted">先选择文书类型，再填写对应字段（仅示意，可编辑）</span></div>' +
          '<div class="form-row" style="max-width:320px"><label>文书类型</label><select data-case-type>' +
          DOC_TYPES.map(function (t) {
            return "<option" + (t === caseType ? " selected" : "") + ">" + t + "</option>";
          }).join("") +
          "</select></div>" +
          '<div class="form-grid">' + fields.map(function (f) { return caseFieldHtml(caseType, f, values[f.key]); }).join("") + "</div>" +
          '<div class="notice info mt12">原始判决书填写案号、裁判法院、审级等；指导性案例与参考案例填写案例名称、相关法条及裁判要点/要旨。</div>' +
          "</div>";
      }

      function step4Html() {
        var html = '<div class="card mb12">' +
          '<div class="row"><div><h3 style="margin:0">指南文件</h3><div class="small muted mt8">系统当前版本：<span class="code-chip">' + APP.esc(guide.version) + "</span>（" + APP.esc(guide.importedAt) + "）</div></div>" +
          '<span class="spacer"></span><button type="button" class="btn primary" data-pick-guide>选择指南文件</button></div>';
        if (guideImported) {
          html += '<div class="small mt12">已选文件：<span class="code-chip">' + APP.esc(guide.file) + "</span></div>";
        } else {
          html += '<div class="notice info mt12">选择《指南》文件后，系统将解析出非命题要素、命题要素与关系类型，供标注时使用。</div>';
        }
        html += "</div>";
        if (guideImported) {
          html += '<div class="card mb12"><div class="row mb12"><h3 style="margin:0">解析结果</h3><span class="spacer"></span><span class="small muted">可删除条目或追加新条目（演示）</span></div>' +
            '<div class="guide-groups">' +
            GUIDE_GROUPS.map(function (g) { return guideGroupHtml(g.key, g.title, parsed[g.key]); }).join("") +
            "</div></div>";
        }
        html += '<div class="grid cols-2">' +
          '<div class="card"><h3>登记版本</h3>' +
          '<div class="form-row"><label>版本号</label><input type="text" data-ver="version" value="' + APP.esc(guide.version) + '"></div>' +
          '<div class="form-row"><label>适用范围</label><input type="text" data-ver="scope" value="' + APP.esc(guide.scope) + '"></div>' +
          '<div class="form-row"><label>操作人</label><input type="text" data-ver="operator" value="' + APP.esc(guide.operator) + '"></div>' +
          '<div class="form-row"><label>说明</label><textarea rows="2" data-ver="note" placeholder="本次指南的主要变化…"></textarea></div>' +
          '<button type="button" class="btn primary" data-register>登记版本</button></div>' +
          '<div class="card"><h3>版本历史</h3><div data-guide-history>' + historyHtml(history) + "</div></div>" +
          "</div>";
        html += '<div class="card mt12" data-version-card>' + versionPickHtml() + "</div>";
        return html;
      }

      function versionPickHtml() {
        var active = activeVersion();
        var items = history.map(function (h) {
          return '<label class="version-item' + (h.version === active ? " on" : "") + '">' +
            '<input type="radio" name="task-guide-version" data-pick-version value="' + APP.esc(h.version) + '"' + (h.version === active ? " checked" : "") + ">" +
            '<span><span class="code-chip">' + APP.esc(h.version) + "</span> " + APP.esc(h.date) + " · " + APP.esc(h.operator) +
            " · 适用范围：" + APP.esc(h.scope || "—") + "</span></label>";
        }).join("");
        if (!items) items = '<div class="small muted">暂无版本记录</div>';
        return "<h3>任务使用的指南版本（单选）</h3>" +
          '<div class="small muted mb8">默认选择最新版本（' + APP.esc(latestVersion()) + "），可在列表中选择其它版本。</div>" +
          '<div class="version-pick">' + items + "</div>" +
          '<div class="notice info">任务绑定后，任务期间标签体系冻结；新版本指南仅影响之后绑定它的任务（《指南》8.3.3）。</div>';
      }

      function refreshVersionPick() {
        var host = contentEl.querySelector("[data-version-card]");
        if (host) host.innerHTML = versionPickHtml();
      }

      function step5Html() {
        var rows = files.length ? files.map(function (f, i) {
          var a = assign[i] || defaultAssign();
          var list = a.annotators && a.annotators.length ? a.annotators : defaultAnnotators();
          return "<tr><td><strong>" + APP.esc(f.name) + '</strong><div class="create-doc-title">' + APP.esc(f.type) + "</div></td>" +
            "<td>" + assignCellHtml(i, list) + "</td>" +
            "<td>" + personSelect(i, "adj", a.adj, adjudicatorPool()) + "</td></tr>";
        }).join("") : '<tr><td colspan="3" class="muted">暂无文书，请返回第 1 步添加</td></tr>';
        return '<div class="card mb12">' +
          '<div class="row"><h3 style="margin:0">分配人员</h3><span class="spacer"></span><button type="button" class="btn" data-batch-assign>按案例类型批量分配</button></div>' +
          '<p class="muted small mt8">每份文书默认由 2 名标注员独立标注，分歧交由 1 名仲裁员裁定。</p>' +
          '<div class="small muted mb8">使用指南版本：<span class="code-chip">' + APP.esc(activeVersion()) + "</span></div>" +
          '<table class="table"><thead><tr><th>文书</th><th>标注员</th><th>仲裁员</th></tr></thead><tbody>' + rows + "</tbody></table>" +
          '<div class="small muted mt8">每份文书至少 2 名标注员（双人独立标注），可继续添加多人；一份案例与标注者之间为多对多关系。' +
          (teaching() ? "教学练习数据与正式任务数据隔离（细节待确认）。" : "") + "</div>" +
          "</div>" +
          '<div class="notice">任务开始后标签体系冻结，新版本指南仅影响之后绑定它的任务。创建前请确认人员与指南版本。</div>';
      }

      function addFile(opts) {
        opts = opts || {};
        var name = opts.name;
        if (!name) {
          name = UPLOAD_POOL[poolIdx % UPLOAD_POOL.length];
          poolIdx++;
        }
        var exists = files.some(function (f) { return f.name === name; });
        if (exists) {
          APP.ui.toast("该文书已在列表中", "warn");
          return;
        }
        files.push({ name: name, title: opts.title || name + "民事一审民事判决书", type: opts.type || "原始判决书" });
        assign.push(defaultAssign());
        APP.ui.toast("已选择文件：" + name);
        render();
      }

      function batchAdd() {
        var added = 0;
        UPLOAD_POOL.forEach(function (name) {
          var exists = files.some(function (f) { return f.name === name; });
          if (exists) return;
          files.push({ name: name, title: name + "民事一审民事判决书", type: "原始判决书" });
          assign.push(defaultAssign());
          added++;
        });
        APP.ui.toast(added ? "已批量选择（新增 " + added + " 份）" : "已批量选择（示例文书均已在列表中）");
        render();
      }

      function pasteModal() {
        APP.ui.modal({
          title: "手动录入 / 复制粘贴",
          body: '<p class="muted small">将裁判文书全文粘贴到下方文本框，系统按《指南》规则提取待标注范围（原型仅示意，不解析真实文本）。</p>' +
            '<textarea rows="8" data-paste-text placeholder="在此粘贴文书全文…"></textarea>',
          actions: [
            { label: "取消" },
            {
              label: "确定", kind: "primary", onClick: function () {
                var ta = document.querySelector("[data-paste-text]");
                var val = ta ? ta.value.trim() : "";
                if (!val) {
                  APP.ui.toast("请先粘贴文书内容", "warn");
                  return false;
                }
                manualCount++;
                addFile({ name: "手动录入文书 " + manualCount, title: "复制粘贴录入（演示）" });
              }
            }
          ]
        });
      }

      function assignModal() {
        APP.ui.modal({
          title: "按案例类型批量分配",
          body: '<p class="muted small">同一文书类型可套用相同的人员配置，批量分配后仍可在列表中逐份调整（演示）。</p>' +
            '<div class="form-row"><label>文书类型</label><select data-batch-type>' + optionList(DOC_TYPES) + "</select></div>" +
            '<div class="form-row"><label>标注员 A</label><select data-batch-a1>' + optionList(ANNOTATORS) + "</select></div>" +
            '<div class="form-row"><label>标注员 B</label><select data-batch-a2>' + optionList(ANNOTATORS) + "</select></div>" +
            '<div class="form-row"><label>仲裁员</label><select data-batch-adj>' + optionList(adjudicatorPool()) + "</select></div>",
          actions: [
            { label: "取消" },
            {
              label: "应用", kind: "primary", onClick: function () {
                var type = document.querySelector("[data-batch-type]").value;
                var a1 = document.querySelector("[data-batch-a1]").value;
                var a2 = document.querySelector("[data-batch-a2]").value;
                var adj = document.querySelector("[data-batch-adj]").value;
                var count = 0;
                files.forEach(function (f, i) {
                  if (f.type === type) { assign[i] = { annotators: [a1, a2], adj: adj }; count++; }
                });
                APP.ui.toast(count ? "已按「" + type + "」批量分配（" + count + " 份）" : "没有「" + type + "」类型的文书", count ? "" : "warn");
                render();
              }
            }
          ]
        });
      }

      function refreshGroup(group) {
        var panel = contentEl.querySelector('[data-group-panel="' + group + '"]');
        if (!panel) return;
        var title = "";
        GUIDE_GROUPS.forEach(function (g) { if (g.key === group) title = g.title; });
        var h4 = panel.querySelector("h4");
        if (h4) h4.textContent = title + "（" + parsed[group].length + "）";
        var list = panel.querySelector('[data-list="' + group + '"]');
        if (list) list.innerHTML = guideItemsHtml(group, parsed[group]);
      }

      function readVer(key) {
        var el = contentEl.querySelector('[data-ver="' + key + '"]');
        return el ? el.value.trim() : "";
      }

      function storeCase(type, key, value) {
        if (!caseValues[type]) caseValues[type] = {};
        caseValues[type][key] = value;
      }

      function createProblems() {
        var problems = [];
        if (!files.length) problems.push("请先上传至少一份文书");
        files.forEach(function (f, i) {
          var a = assign[i] || {};
          var list = a.annotators || [];
          if (list.length < 2) problems.push("「" + f.name + "」标注员不足 2 名（当前 " + list.length + " 名）");
          var seen = {};
          var dups = [];
          list.forEach(function (n) {
            if (seen[n] && dups.indexOf(n) === -1) dups.push(n);
            seen[n] = true;
          });
          if (dups.length) problems.push("「" + f.name + "」标注员重复：" + dups.join("、"));
          if (!a.adj) problems.push("「" + f.name + "」未选择仲裁员");
        });
        return problems;
      }

      root.addEventListener("click", function (e) {
        var t = e.target;
        if (!t || !t.closest) return;

        var nav = t.closest("[data-nav]");
        if (nav) {
          var dir = nav.getAttribute("data-nav");
          if (dir === "prev") setStep(step - 1);
          else if (dir === "next") {
            if (step === 1 && !files.length) {
              APP.ui.toast("请先上传至少一份文书", "warn");
              return;
            }
            setStep(step + 1);
          } else if (dir === "create") {
            var problems = createProblems();
            if (problems.length) {
              APP.ui.modal({
                title: "无法创建任务",
                body: '<p class="muted small">请修正以下问题后再提交：</p><ul class="modal-issues">' +
                  problems.map(function (p) { return "<li>" + APP.esc(p) + "</li>"; }).join("") + "</ul>",
                actions: [{ label: "知道了", kind: "primary" }]
              });
              return;
            }
            APP.ui.toast("任务已创建（演示）", "ok");
            APP.goto("tasks");
          }
          return;
        }

        if (t.closest("[data-upload]")) { addFile(); return; }
        if (t.closest("[data-batch]")) { batchAdd(); return; }
        if (t.closest("[data-paste]")) { pasteModal(); return; }

        var rem = t.closest("[data-remove-file]");
        if (rem) {
          var idx = Number(rem.getAttribute("data-remove-file"));
          var removed = files.splice(idx, 1)[0];
          assign.splice(idx, 1);
          if (removed) APP.ui.toast("已移除：" + removed.name);
          render();
          return;
        }

        var annAdd = t.closest("[data-add-annotator]");
        if (annAdd) {
          var annRow = Number(annAdd.getAttribute("data-add-annotator"));
          var rowAssign = assign[annRow];
          if (rowAssign && rowAssign.annotators) {
            var next = ANNOTATORS.filter(function (n) { return rowAssign.annotators.indexOf(n) === -1; })[0] || ANNOTATORS[0];
            rowAssign.annotators.push(next);
            render();
          }
          return;
        }

        var annRm = t.closest("[data-remove-annotator]");
        if (annRm) {
          var rmRow = Number(annRm.getAttribute("data-remove-annotator"));
          var rmSlot = Number(annRm.getAttribute("data-slot"));
          var rmList = assign[rmRow] && assign[rmRow].annotators;
          if (rmList && rmList.length > 2) {
            rmList.splice(rmSlot, 1);
            render();
          }
          return;
        }

        if (t.closest("[data-reextract]")) { APP.ui.toast("已按指南规则重新提取"); return; }
        if (t.closest("[data-adjust]")) { APP.ui.pending("手动拖动调整提取范围"); return; }

        if (t.closest("[data-pick-guide]")) {
          guideImported = true;
          APP.ui.toast("已选择指南文件：" + guide.file);
          render();
          return;
        }

        var del = t.closest("[data-del-guide]");
        if (del) {
          var g1 = del.getAttribute("data-del-guide");
          var i1 = Number(del.getAttribute("data-idx"));
          if (parsed[g1] && parsed[g1][i1] != null) {
            var gone = parsed[g1].splice(i1, 1)[0];
            refreshGroup(g1);
            APP.ui.toast("已删除：" + gone);
          }
          return;
        }

        var add = t.closest("[data-add-item]");
        if (add) {
          var g2 = add.getAttribute("data-add-item");
          var input = contentEl.querySelector('[data-add-input="' + g2 + '"]');
          var val = input ? input.value.trim() : "";
          if (!val) {
            APP.ui.toast("请先输入内容", "warn");
            return;
          }
          parsed[g2].push(val);
          if (input) input.value = "";
          refreshGroup(g2);
          APP.ui.toast("已添加：" + val);
          return;
        }

        if (t.closest("[data-register]")) {
          var version = readVer("version") || guide.version;
          var operator = readVer("operator") || APP.roleName();
          var scope = readVer("scope") || "全部任务";
          var note = readVer("note");
          var dup = history.some(function (h) { return h.version === version; });
          if (dup) note = "（版本号重复，按新版本登记）" + (note || "");
          if (!note) note = "—";
          history.push({ version: version, date: today(), operator: operator, note: note, scope: scope });
          selectedVersion = version;
          APP.ui.toast("指南版本已登记（历史版本只读保留，重复版本号按新版本登记）", "ok");
          var host = contentEl.querySelector("[data-guide-history]");
          if (host) host.innerHTML = historyHtml(history);
          refreshVersionPick();
          return;
        }

        if (t.closest("[data-batch-assign]")) { assignModal(); return; }
      });

      root.addEventListener("change", function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        if (t.hasAttribute && t.hasAttribute("data-pick-version")) {
          selectedVersion = t.value;
          Array.prototype.forEach.call(contentEl.querySelectorAll(".version-item"), function (item) {
            var inp = item.querySelector("input[data-pick-version]");
            item.classList.toggle("on", !!inp && inp.value === selectedVersion);
          });
          return;
        }
        var sel = t.closest("select");
        if (!sel) return;
        if (sel.hasAttribute("data-task-type")) {
          taskType = sel.value;
          assign = newAssign();
          render();
          return;
        }
        if (sel.hasAttribute("data-case-type")) {
          caseType = sel.value;
          render();
          return;
        }
        var field = sel.getAttribute("data-case-field");
        if (field) {
          storeCase(field, sel.getAttribute("data-key"), sel.value);
          return;
        }
        var kind = sel.getAttribute("data-assign");
        if (kind) {
          var row = Number(sel.getAttribute("data-row"));
          if (!assign[row]) return;
          if (kind === "adj") {
            assign[row].adj = sel.value;
          } else if (kind === "annotator") {
            var slot = Number(sel.getAttribute("data-slot"));
            if (assign[row].annotators) assign[row].annotators[slot] = sel.value;
          }
        }
      });

      root.addEventListener("input", function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        var field = t.closest("[data-case-field]");
        if (field) storeCase(field.getAttribute("data-case-field"), field.getAttribute("data-key"), field.value);
      });

      render();
    }
  });
})();

      '<div class="list">' + S.segments.map(function (s) {
        var active = S.relPicked.indexOf(s.id) >= 0;
        var disabled = !s.type;
        return '<div class="list-item' + (active ? " active" : "") + (disabled ? " va-disabled" : "") +
          '" data-rel-pick="' + s.id + '" title="' + APP.esc(disabled ? "未标注要素不可参与关系" : s.text) + '">' +
          '<span class="idx">' + s.id + '</span><span class="txt">' + APP.esc(s.text) + "</span>" +
          (s.type ? '<span class="tag green">' + APP.esc(s.type) + "</span>" : '<span class="tag amber">未标注</span>') +
          "</div>";
      }).join("") + "</div></div>";

    var relBtns = REL_TYPES.map(function (r) {
      return '<button type="button" class="' + (S.relType === r.code ? "active" : "") + '" data-rel-type="' + r.code + '">' +
        '<span class="code">' + r.code + "</span>" + r.name + "</button>";
    }).join("");
    var cur = relTypeByCode(S.relType);
    var rule = cur ? cur.rule : "请选择关系类型；已选要素将按点击顺序写入形式化表达。";

    var mid = '<div class="tag-panel">' +
      '<div class="tag-group"><h4>关系类型（单选）</h4><div class="tag-options">' + relBtns + "</div></div>" +
      '<div class="small muted">' + APP.esc(rule) + "</div>" +
      '<div class="small">已选要素：' + (S.relPicked.length
        ? S.relPicked.map(function (id) { return '<span class="code-chip">' + APP.esc(id) + "</span>"; }).join(" ")
        : '<span class="muted">未选择</span>') + "</div>" +
      '<div class="row"><button type="button" class="btn primary' + (canEdit ? "" : " va-disabled") + '" data-act="make-rel">生成关系</button></div>' +
      '<div class="row"><button type="button" class="btn small' + (canEdit ? "" : " va-disabled") + '" data-act="demo-nested">演示嵌套：反对一个支持关系</button></div>' +
      "</div>";

    var rows = S.relations.map(function (r) {
      var rt = relTypeByCode(r.type) || { name: r.type, cls: "gray" };
      return "<tr>" +
        '<td><span class="mono">' + APP.esc(r.id) + "</span>" + (r.demo ? ' <span class="tag violet">演示</span>' : "") + "</td>" +
        '<td><span class="tag ' + rt.cls + '">' + APP.esc(r.type) + " " + APP.esc(rt.name) + "</span></td>" +
        "<td>" + r.members.map(function (m) { return '<span class="code-chip">' + APP.esc(m) + "</span>"; }).join(" ") + "</td>" +
        '<td><span class="code-chip">' + APP.esc(r.formal) + "</span></td>" +
        '<td><button type="button" class="btn small danger' + (canEdit ? "" : " va-disabled") + '" data-del-rel="' + APP.esc(r.id) + '">删除</button></td>' +
        "</tr>";
    }).join("");

    var right = "<div>" +
      '<table class="table va-rel-table"><thead><tr><th>编号</th><th>类型</th><th>成员</th><th>形式化表达</th><th></th></tr></thead>' +
      "<tbody>" + (rows || '<tr><td colspan="5" class="muted">暂无关系</td></tr>') + "</tbody></table>" +
      '<div class="notice info mt12">独立支持与组合支持不可混同：分别独立支持写作多条 S(pi, pj)；合取支持写作 S(J(...), pj)。</div>' +
      "</div>";

    return '<div class="workbench">' + left + mid + right + "</div>";
  }
  function svgHeight(dg) {
    var maxY = 0;
    (dg.nodes || []).concat(dg.relNodes || []).forEach(function (n) {
      if (n.y > maxY) maxY = n.y;
    });
    return Math.max(620, maxY + 60);
  }

  function svgFor(dg) {
    if (!dg) return "";
    var pos = {};
    (dg.nodes || []).forEach(function (n) { pos[n.id] = n; });
    (dg.relNodes || []).forEach(function (n) { pos[n.id] = n; });

    var edges = (dg.edges || []).map(function (e) {
      var a = pos[e.from];
      var b = pos[e.to];
      if (!a || !b) return "";
      var attr = 'stroke="#98a2b3" stroke-width="1.5"';
      if (e.demo) attr += ' stroke-dasharray="4 3"';
      if (e.arrow) attr += ' marker-end="url(#arrow)"';
      return '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" ' + attr + "></line>";
    }).join("");

    var nodes = (dg.nodes || []).map(function (n) {
      return '<g class="node" data-kind="node" data-id="' + APP.esc(n.id) + '" transform="translate(' + n.x + "," + n.y + ')">' +
        '<rect x="-34" y="-15" width="68" height="30" rx="6" fill="#fff" stroke="#1f2430"></rect>' +
        '<text text-anchor="middle" y="4">' + APP.esc(n.id) + "</text></g>";
    }).join("");

    var rels = (dg.relNodes || []).map(function (n) {
      var body;
      if (n.kind === "slash") {
        body = '<rect x="-13" y="-9" width="26" height="18" rx="4" fill="#fff" stroke="#1f2430"></rect>' +
          '<text text-anchor="middle" y="4">/</text>';
      } else {
        var fill = n.kind === "support" ? "#1f2430" : "#fff";
        var label = n.kind === "plus" ? '<text text-anchor="middle" y="4">+</text>' : "";
        body = '<circle r="12" fill="' + fill + '" stroke="#1f2430"></circle>' + label;
      }
      return '<g class="rel-node" data-kind="rel" data-id="' + APP.esc(n.id) + '" transform="translate(' + n.x + "," + n.y + ')">' + body + "</g>";
    }).join("");

    return '<svg viewBox="0 0 800 ' + svgHeight(dg) + '" role="img" aria-label="' + APP.esc(dg.title || "") + '" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">' +
      '<path d="M0,0 L7,3 L0,6 z" fill="#667085"></path></marker></defs>' +
      edges + nodes + rels + "</svg>";
  }

  function redrawSvg() {
    var host = hostRoot.querySelector(".va-svg-host");
    var dg = curDiagram();
    if (host && dg) host.innerHTML = svgFor(dg);
  }

  function relById(id) {
    for (var i = 0; i < S.relations.length; i++) {
      if (S.relations[i].id === id) return S.relations[i];
    }
    return null;
  }

  function relKind(type) {
    if (type === "S") return "support";
    if (type === "A") return "attack";
    if (type === "I") return "slash";
    return "plus";
  }

  function buildDiagramFromRelations() {
    var pos = {};
    var seq = 0;
    var cache = {};

    function depthOf(id, seen) {
      var r = relById(id);
      if (!r) return 0;
      if (cache[id] != null) return cache[id];
      if (seen[id]) return 0;
      seen[id] = true;
      var d = 0;
      r.members.forEach(function (m) {
        if (relById(m)) d = Math.max(d, depthOf(m, seen));
      });
      seen[id] = false;
      cache[id] = d + 1;
      return cache[id];
    }

    S.relations.forEach(function (r) {
      pos[r.id] = { id: r.id, kind: relKind(r.type), depth: depthOf(r.id, {}), seq: seq++ };
    });
    S.relations.forEach(function (r) {
      r.members.forEach(function (m) {
        if (!pos[m]) pos[m] = { id: m, kind: "", depth: 0, seq: seq++ };
      });
    });

    var list = Object.keys(pos).map(function (k) { return pos[k]; });
    list.sort(function (a, b) { return a.depth - b.depth || a.seq - b.seq; });
    var layer = {};
    list.forEach(function (n) {
      var i = layer[n.depth] || 0;
      layer[n.depth] = i + 1;
      n.x = 80 + n.depth * 190;
      n.y = 90 + i * 80;
    });
    list.forEach(function (n) {
      if (!n.kind) return;
      var minY = Infinity;
      var maxY = -Infinity;
      relById(n.id).members.forEach(function (m) {
        if (!pos[m]) return;
        minY = Math.min(minY, pos[m].y);
        maxY = Math.max(maxY, pos[m].y);
      });
      if (minY !== Infinity) n.y = Math.round((minY + maxY) / 2);
    });

    var nodes = [];
    var relNodes = [];
    list.forEach(function (n) {
      if (n.kind) relNodes.push({ id: n.id, kind: n.kind, x: n.x, y: n.y });
      else nodes.push({ id: n.id, x: n.x, y: n.y });
    });

    var edges = [];
    S.relations.forEach(function (r) {
      var members = r.members;
      if (r.type === "S" || r.type === "A") {
        edges.push({ from: members[0], to: r.id });
        edges.push({ from: r.id, to: members[1], arrow: true });
      } else if (r.type === "M") {
        members.slice(0, members.length - 1).forEach(function (m) {
          edges.push({ from: m, to: r.id });
        });
        edges.push({ from: r.id, to: members[members.length - 1], arrow: true });
      } else {
        members.forEach(function (m) {
          edges.push({ from: m, to: r.id });
        });
      }
    });

    return { id: "dg-gen", title: GEN_TITLE, generated: true, nodes: nodes, relNodes: relNodes, edges: edges };
  }

  function rebuildDiagram() {
    var dg = buildDiagramFromRelations();
    var idx = -1;
    for (var i = 0; i < S.diagrams.length; i++) {
      if (S.diagrams[i].generated) { idx = i; break; }
    }
    if (idx < 0) {
      S.diagrams.push(dg);
      idx = S.diagrams.length - 1;
    } else {
      S.diagrams[idx] = dg;
    }
    S.dg = idx;
    paint();
  }

  function afterRelChange() {
    var dg = curDiagram();
    if (dg && dg.generated) {
      rebuildDiagram();
      APP.ui.toast("关系已更新，图示已自动重建（演示）");
      return true;
    }
    APP.ui.toast("关系已更新，可点『按关系表重建图示』刷新");
    return false;
  }

  function renderDiagram() {
    var dg = curDiagram();
    var subTabs = S.diagrams.map(function (t, i) {
      return '<button type="button" data-dg="' + i + '"' + (i === S.dg ? ' class="active"' : "") + ">" + APP.esc(t.title) + "</button>";
    }).join("");
    var legend = '<div class="legend">' +
      '<span><i class="fill"></i>支持</span>' +
      "<span><i></i>反对</span>" +
      '<span><i class="plus">+</i>组合/匹配</span>' +
      '<span><i class="slash">/</i>同一</span>' +
      "</div>";
    return '<div class="tabs">' + subTabs + "</div>" +
      '<div class="row mb8">' + legend + '<span class="spacer"></span>' +
      '<button type="button" class="btn small' + (canEdit ? "" : " va-disabled") + '" data-act="rebuild-diagram">按关系表重建图示（演示）</button>' +
      '<button type="button" class="btn small" data-act="zoom-out">缩小</button>' +
      '<span class="va-zoom-label" data-slot="zoom-label">' + Math.round(S.zoom * 100) + "%</span>" +
      '<button type="button" class="btn small" data-act="zoom-in">放大</button>' +
      '<button type="button" class="btn small" data-act="zoom-reset">重置</button>' +
      '<button type="button" class="btn primary' + (canEdit ? "" : " va-disabled") + '" data-act="submit-diagram">提交仲裁员审查</button></div>' +
      (dg ? '<div class="diagram' + (canEdit ? "" : " va-disabled") + '" id="va-diagram">' +
        '<div class="va-viewport">' +
        '<div class="va-pan" data-slot="pan" style="transform:translate(' + S.panX + 'px,' + S.panY + 'px) scale(' + S.zoom + ')">' +
        '<div class="va-svg-host">' + svgFor(dg) + "</div></div></div></div>"
        : '<div class="empty">暂无图示数据</div>') +
      '<div class="notice info mt12">命题节点以带框序号表示；命题类型仅存在于标注表/数据库，不进入图示（依《指南》6.1）。滚轮缩放、拖拽空白处平移、拖拽节点调整位置。</div>';
  }

  function nextRelId() {
    var max = 0;
    S.relations.forEach(function (r) {
      var m = /^R(\d+)$/.exec(r.id);
      if (m) max = Math.max(max, Number(m[1]));
    });
    return "R" + (max + 1);
  }

  function togglePiece(el) {
    if (!canEdit) {
      APP.ui.toast(READONLY_MSG, "warn");
      return;
    }
    var id = el.getAttribute("data-piece");
    var p = null;
    S.pieces.forEach(function (x) { if (x.id === id) p = x; });
    if (!p) return;
    p.boxed = !p.boxed;
    el.classList.toggle("boxed", p.boxed);
    var c = hostRoot.querySelector(".va-box-count");
    if (c) c.textContent = S.pieces.filter(function (x) { return x.boxed; }).length;
  }

  function onTag(val) {
    var tag = tagByValue(val);
    var s = segById(S.picked);
    if (!s) {
      APP.ui.modal({
        title: "标签定义 · " + (tag ? tag.name : val),
        body: "<p>" + APP.esc(tag ? tag.def : "") + "</p>" +
          '<p class="muted small">' + (canEdit ? "先选中左侧要素，再点击标签即可完成标注。" : "只读模式：标签定义仅供查看，不能用于标注。") + "</p>",
        actions: [{ label: "知道了", kind: "primary" }]
      });
      return;
    }
    if (!canEdit) {
      APP.ui.toast(READONLY_MSG, "warn");
      return;
    }
    s.type = val;
    APP.ui.toast(s.id + " 已标注为 " + val);
    paint();
  }

  function toggleRelPick(id) {
    var s = segById(id);
    if (!s || !s.type) {
      APP.ui.toast("未标注要素不可参与关系，请先补标类型", "warn");
      return;
    }
    var i = S.relPicked.indexOf(id);
    if (i >= 0) S.relPicked.splice(i, 1);
    else S.relPicked.push(id);
    paint();
  }

  function delRel(id) {
    if (!canEdit) {
      APP.ui.toast(READONLY_MSG, "warn");
      return;
    }
    S.relations = S.relations.filter(function (r) { return r.id !== id; });
    APP.ui.toast("已删除关系 " + id + "（演示）");
    if (!afterRelChange()) paint();
  }

  function makeRel() {
    var type = S.relType;
    var ids = S.relPicked.slice();
    if (!type) {
      APP.ui.toast("请先选择关系类型", "warn");
      return;
    }
    if (type === "J" || type === "I") {
      if (ids.length < 2) {
        APP.ui.toast(relTypeByCode(type).name + "关系至少需要选择 2 个要素（当前 " + ids.length + " 个）", "warn");
        return;
      }
    } else if (ids.length !== 2) {
      if (type === "M") {
        APP.ui.toast("匹配关系需选择 2 个要素（当前 " + ids.length + " 个）；匹配关系发生在个别判断与一般判断之间", "warn");
      } else {
        APP.ui.toast(relTypeByCode(type).name + "关系必须恰好选择 2 个要素（当前 " + ids.length + " 个）", "warn");
      }
      return;
    }
    var rel = { id: nextRelId(), type: type, members: ids, formal: type + "(" + ids.join(", ") + ")" };
    S.relations.push(rel);
    S.relPicked = [];
    APP.ui.toast("已生成 " + rel.formal + "（" + rel.id + "）");
    if (!afterRelChange()) paint();
  }

  function demoNested() {
    var d = M.nestedDemo;
    if (!d) return;
    var exists = S.relations.some(function (r) { return r.demo && r.formal === d.formal; });
    if (exists) {
      APP.ui.toast("嵌套示例已在关系表中（" + d.formal + "）", "warn");
      return;
    }
    var id = d.id;
    var taken = S.relations.some(function (r) { return r.id === id; });
    if (taken) id = nextRelId();
    S.relations.push({ id: id, type: d.type, members: d.members.slice(), formal: d.formal, demo: true });
    APP.ui.toast("已添加嵌套关系（关系可指向另一关系）");
    paint();
  }

  function submitCut() {
    var boxed = S.pieces.filter(function (p) { return p.boxed; }).length;
    APP.ui.modal({
      title: "提交切割 · 与标准切割对比",
      body: "<p>与标准切割对比：差异度 <b>6%</b>（演示值，阈值 10%）—— <span class='ok-text'>通过</span></p>" +
        '<p class="small">当前加框 ' + boxed + " / " + S.pieces.length + " 个切割片段。</p>" +
        '<p class="muted small">双人独立切割后由仲裁员比较，差异度≤10% 才能进入下一步。</p>' +
        '<p class="muted small">若差异度&gt;10%，需按仲裁意见重新切割后再次提交。</p>',
      actions: [
        { label: "关闭" },
        { label: "确认提交", kind: "primary", onClick: function () { APP.ui.toast("切割已提交（演示）"); } }
      ]
    });
  }

  function submitElements() {
    var un = S.segments.filter(function (s) { return !s.type; });
    if (!un.length) {
      APP.ui.toast("要素标注已提交（演示）");
      return;
    }
    APP.ui.modal({
      title: "提交前检查",
      body: "<p>以下要素尚未标注类型：</p><ul class='small'>" +
        un.map(function (s) { return "<li><b>" + APP.esc(s.id) + "</b> " + APP.esc(s.text) + "</li>"; }).join("") +
        "</ul><p class='warn-text'>存在未标注要素，正式流程应补齐后再提交；原型中可继续提交以便演示。</p>",
      actions: [
        { label: "返回修改" },
        { label: "仍然提交", kind: "primary", onClick: function () { APP.ui.toast("已提交（含未标注要素，演示）"); } }
      ]
    });
  }

  function deleteElem() {
    var s = segById(S.picked);
    if (!s) {
      APP.ui.toast("请先选择要删除的要素", "warn");
      return;
    }
    var related = S.relations.filter(function (r) { return r.members.indexOf(s.id) >= 0; });
    APP.ui.confirm("确定删除要素 " + s.id + " 吗？", function () {
      S.segments = S.segments.filter(function (x) { return x.id !== s.id; });
      var i = S.relPicked.indexOf(s.id);
      if (i >= 0) S.relPicked.splice(i, 1);
      S.picked = "";
      if (related.length) {
        APP.ui.toast(s.id + " 存在 " + related.length + " 条关联关系，正式流程需一并处理（示意）", "warn");
      } else {
        APP.ui.toast("已删除要素 " + s.id + "（演示）");
      }
      paint();
    });
  }

  function submitDiagram() {
    APP.ui.modal({
      title: "提交仲裁员审查",
      body: "<p>图示将提交仲裁员审查，检查项：</p><ul class='small'>" +
        "<li><b>错误刻画</b>：支持 / 反对 / 组合 / 匹配 / 同一是否与标注表一致</li>" +
        "<li><b>符号错误</b>：节点形状、连线箭头与图例规范是否一致</li>" +
        "<li><b>遗漏</b>：命题与关系是否完整呈现</li></ul>",
      actions: [
        { label: "取消" },
        { label: "确认提交", kind: "primary", onClick: function () { APP.ui.toast("已提交仲裁员审查"); } }
      ]
    });
  }

  function act(name) {
    if (!canEdit && READONLY_BLOCKED[name]) {
      APP.ui.toast(READONLY_MSG, "warn");
      return;
    }
    if (name === "admin-detail") { S.adminDetail = true; renderView(hostRoot, APP.state.params); return; }
    if (name === "admin-back") { S.adminDetail = false; renderView(hostRoot, APP.state.params); return; }
    if (name === "adjudicate") { APP.goto("adjudicate"); return; }
    if (name === "export") { APP.goto("export"); return; }
    if (name === "save") { APP.ui.toast("已保存到草稿"); return; }
    if (name === "submit") { APP.ui.toast(APP.state.practice ? "已提交练习（演示）" : "已提交（演示）"); return; }
    if (name === "re-extract") { APP.ui.toast("已按指南重新提取切割片段（演示）"); return; }
    if (name === "drag-range") { APP.ui.pending("手动拖动调整切割范围"); return; }
    if (name === "submit-cut") { submitCut(); return; }
    if (name === "pre-number") { APP.ui.toast("已启用「先编号后补标签」（演示）：新要素可暂缺类型，编号保留，待后续补标"); return; }
    if (name === "delete-elem") { deleteElem(); return; }
    if (name === "submit-elements") { submitElements(); return; }
    if (name === "make-rel") { makeRel(); return; }
    if (name === "demo-nested") { demoNested(); return; }
    if (name === "rebuild-diagram") { rebuildDiagram(); APP.ui.toast("已按关系表重建图示（演示）"); return; }
    if (name === "exit-practice") {
      APP.state.practice = false;
      APP.goto("annotate", { mode: S.tab });
      APP.ui.toast("已退出练习模式");
      return;
    }
    if (name === "zoom-in") { zoomBy(1.25); return; }
    if (name === "zoom-out") { zoomBy(1 / 1.25); return; }
    if (name === "zoom-reset") { S.zoom = 1; S.panX = 0; S.panY = 0; applyView(); return; }
    if (name === "submit-diagram") { submitDiagram(); return; }
  }

  function clampZoom(z) { return Math.max(0.4, Math.min(2.5, z)); }

  function applyView() {
    var pan = hostRoot.querySelector("#va-diagram .va-pan");
    if (pan) pan.style.transform = "translate(" + S.panX + "px," + S.panY + "px) scale(" + S.zoom + ")";
    var label = hostRoot.querySelector('[data-slot="zoom-label"]');
    if (label) label.textContent = Math.round(S.zoom * 100) + "%";
  }

  function zoomBy(factor) {
    S.zoom = clampZoom(S.zoom * factor);
    applyView();
  }

  function onWheel(e) {
    if (S.tab !== "diagram") return;
    if (!e.target.closest || !e.target.closest("#va-diagram")) return;
    var vp = hostRoot.querySelector("#va-diagram .va-viewport");
    if (!vp) return;
    e.preventDefault();
    var rect = vp.getBoundingClientRect();
    var cx = e.clientX - rect.left;
    var cy = e.clientY - rect.top;
    var prev = S.zoom;
    var next = clampZoom(prev * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
    if (next === prev) return;
    S.panX = cx - (cx - S.panX) * (next / prev);
    S.panY = cy - (cy - S.panY) * (next / prev);
    S.zoom = next;
    applyView();
  }

  function onMouseDown(e) {
    if (e.button !== 0 || S.tab !== "diagram") return;
    var g = e.target.closest ? e.target.closest(".node, .rel-node") : null;
    if (g) {
      if (!canEdit) return;
      var svg = hostRoot.querySelector("#va-diagram svg");
      if (!svg) return;
      e.preventDefault();
      dragState = {
        mode: "node",
        kind: g.getAttribute("data-kind"),
        id: g.getAttribute("data-id"),
        rect: svg.getBoundingClientRect()
      };
      document.addEventListener("mousemove", onMouseMove);
      document.addEventListener("mouseup", onMouseUp);
      return;
    }
    var vp = e.target.closest ? e.target.closest("#va-diagram .va-viewport") : null;
    if (!vp) return;
    e.preventDefault();
    if (vp.classList) vp.classList.add("grabbing");
    dragState = { mode: "pan", startX: e.clientX, startY: e.clientY, baseX: S.panX, baseY: S.panY };
    document.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", onMouseUp);
  }

  function onMouseMove(e) {
    if (!dragState) return;
    if (dragState.mode === "pan") {
      S.panX = dragState.baseX + (e.clientX - dragState.startX);
      S.panY = dragState.baseY + (e.clientY - dragState.startY);
      applyView();
      return;
    }
    var dg = curDiagram();
    if (!dg) return;
    var scale = 800 / dragState.rect.width;
    var x = Math.round((e.clientX - dragState.rect.left) * scale);
    var y = Math.round((e.clientY - dragState.rect.top) * scale);
    x = Math.max(20, Math.min(780, x));
    y = Math.max(20, Math.min(svgHeight(dg) - 20, y));
    var list = dragState.kind === "rel" ? dg.relNodes : dg.nodes;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === dragState.id) {
        list[i].x = x;
        list[i].y = y;
        break;
      }
    }
    redrawSvg();
  }

  function onMouseUp() {
    dragState = null;
    document.removeEventListener("mousemove", onMouseMove);
    document.removeEventListener("mouseup", onMouseUp);
    var vp = hostRoot.querySelector("#va-diagram .va-viewport");
    if (vp && vp.classList) vp.classList.remove("grabbing");
  }

  function onMouseOver(e) {
    var b = e.target.closest ? e.target.closest("button[data-tag]") : null;
    if (!b || (e.relatedTarget && b.contains(e.relatedTarget))) return;
    var line = hostRoot.querySelector(".va-def-line");
    var tag = tagByValue(b.getAttribute("data-tag"));
    if (line && tag) line.textContent = "「" + (tag.code ? tag.code + " " : "") + tag.name + "」" + tag.def;
  }

  function onMouseOut(e) {
    var b = e.target.closest ? e.target.closest("button[data-tag]") : null;
    if (!b || (e.relatedTarget && b.contains(e.relatedTarget))) return;
    var line = hostRoot.querySelector(".va-def-line");
    if (line) line.textContent = DEF_HINT;
  }

  function onClick(e) {
    var t = e.target.closest ? e.target.closest("button[data-tab]") : null;
    if (t) { setTab(t.getAttribute("data-tab")); return; }
    t = e.target.closest ? e.target.closest("button[data-act]") : null;
    if (t) { act(t.getAttribute("data-act")); return; }
    t = e.target.closest ? e.target.closest("button[data-tag]") : null;
    if (t) { onTag(t.getAttribute("data-tag")); return; }
    t = e.target.closest ? e.target.closest("button[data-rel-type]") : null;
    if (t) { S.relType = t.getAttribute("data-rel-type"); paint(); return; }
    t = e.target.closest ? e.target.closest("[data-piece]") : null;
    if (t) { togglePiece(t); return; }
    t = e.target.closest ? e.target.closest("[data-rel-pick]") : null;
    if (t) { toggleRelPick(t.getAttribute("data-rel-pick")); return; }
    t = e.target.closest ? e.target.closest("[data-seg]") : null;
    if (t) { S.picked = t.getAttribute("data-seg"); paint(); return; }
    t = e.target.closest ? e.target.closest("button[data-del-rel]") : null;
    if (t) { delRel(t.getAttribute("data-del-rel")); return; }
    t = e.target.closest ? e.target.closest("button[data-dg]") : null;
    if (t) { S.dg = Number(t.getAttribute("data-dg")) || 0; paint(); return; }
  }

  var RENDER = {
    cut: renderCut,
    elements: renderElements,
    relations: renderRelations,
    diagram: renderDiagram
  };

  function renderView(root, params) {
    ensure();
    hostRoot = root;
    canEdit = APP.role() === "annotator" || (APP.role() === "student" && APP.state.practice);
    if (APP.role() === "admin" && !S.adminDetail) {
      renderAdminOverview(root);
      root.addEventListener("click", onClick);
      return;
    }
    if (params && TAB_IDS.indexOf(params.mode) >= 0) S.tab = params.mode;
    else if (!S.rendered) S.tab = "cut";
    S.rendered = true;
    APP.state.annotateMode = S.tab;
    root.innerHTML =
      '<div class="page">' +
      headHtml() +
      '<div class="tabs">' + TABS.map(function (t) {
        return '<button type="button" data-tab="' + t.id + '"' + (S.tab === t.id ? ' class="active"' : "") + ">" + t.label + "</button>";
      }).join("") + "</div>" +
      '<div class="va-body"></div>' +
      "</div>";
    paint();
    root.addEventListener("click", onClick);
    root.addEventListener("mousedown", onMouseDown);
    root.addEventListener("mouseover", onMouseOver);
    root.addEventListener("mouseout", onMouseOut);
    root.addEventListener("wheel", onWheel, { passive: false });
  }

  APP.registerView("annotate", {
    title: "标注工作台",
    render: renderView,
    leave: function () {
      S.adminDetail = false;
      dragState = null;
      document.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("mouseup", onMouseUp);
    }
  });
})();

    if (!store.docs) store.docs = DOC_RECORDS.slice();

    });

  }

  function kindCls(kind) { return KIND_CLS[kind] || "gray"; }

  function roOff() { return canAdj ? "" : ' aria-disabled="true"'; }
  function roOffExpert() { return canExpert ? "" : ' aria-disabled="true"'; }

  function find(id) {
    return store.diffs.filter(function (d) { return d.id === id; })[0];
  }

  function visibleDiffs() {
    return store.diffs.filter(function (d) { return store.filter === "全部" || d.kind === store.filter; });
  }

  function findRel(id) {
    var arr = APP.data.relations || [];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) return arr[i];
    }
    return null;
  }

  function collectSegs(ids, known, out, depth) {
    (ids || []).forEach(function (id) {
      if (out.indexOf(id) >= 0) return;
      if (known[id]) { out.push(id); return; }
      if (depth <= 0 || !/^R\d+$/i.test(id)) return;
      var rel = findRel(id);
      if (rel) collectSegs(rel.members, known, out, depth - 1);
    });
  }

  function targetSegs(target) {
    var t = String(target || "").trim().toUpperCase();
    var known = {};
    (APP.data.segments || []).forEach(function (s) { known[s.id] = true; });
    var out = [];
    if (/^R\d+$/.test(t)) {
      var rel = findRel(t);
      if (rel) collectSegs(rel.members, known, out, 5);
      return out;
    }
    t.split("-").forEach(function (part) {
      var id = part.trim();
      if (known[id] && out.indexOf(id) < 0) out.push(id);
    });
    return out;
  }

  function pickedTarget() {
    var d = store.picked ? find(store.picked) : null;
